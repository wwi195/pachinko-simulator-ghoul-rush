<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>パチンコシミュレーター（RUSH演出ver）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div id="title-bar">パチンコ　e東京喰種 RUSH演出ver</div>

    <div id="header">
      <div class="hrow hrow1">
        <div class="stat-block">
          <span class="stat-label">プレイ回数</span>
          <span class="stat-value" id="total-plays-value">0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">累計収支</span>
          <span class="stat-value gold" id="total-profit-value">+0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">最高連チャン</span>
          <span class="stat-value" id="max-chain-value">0連</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">総獲得出玉</span>
          <span class="stat-value" id="total-balls-value">0</span>
        </div>
      </div>

      <div class="hrow hrow-holds" id="holds-row" hidden>
        <div class="lcd-screen" id="lcd-screen">
          <div class="lcd-digit" id="lcd-digit-0">-</div>
          <div class="lcd-digit" id="lcd-digit-1">-</div>
          <div class="lcd-digit" id="lcd-digit-2">-</div>
        </div>
        <div class="current-hold-wrap">
          <div class="hold-icon" id="current-hold-icon"></div>
        </div>
        <div class="hold-stock-row">
          <div class="hold-icon" data-slot="0"></div>
          <div class="hold-icon" data-slot="1"></div>
          <div class="hold-icon" data-slot="2"></div>
          <div class="hold-icon" data-slot="3"></div>
        </div>
      </div>

      <div class="hrow hrow-rush-status" id="rush-status-row" hidden>
        <div class="esup-block">
          <div class="esup-label">ST残り</div>
          <div class="esup-value" id="st-remaining-value">－</div>
        </div>
        <div class="esup-block">
          <div class="esup-label">連チャン</div>
          <div class="esup-value" id="chain-count-value">0</div>
        </div>
        <div class="esup-block">
          <div class="esup-label">獲得出玉</div>
          <div class="esup-value" id="rush-balls-value">0</div>
        </div>
      </div>

      <div class="hrow hrow-rush-money" id="rush-money-row" hidden>
        <div class="esup-block">
          <div class="esup-label">投資額</div>
          <div class="esup-value" id="rush-toushi-value">0円</div>
        </div>
        <div class="esup-block">
          <div class="esup-label">現在の収支</div>
          <div class="esup-value" id="rush-profit-value">+0円</div>
        </div>
      </div>

      <div id="pause-row" hidden>
        <div class="hrow hrow-speed-row">
          <div class="speed-btns" id="rush-speed-btns"></div>
        </div>
        <div class="hrow hrow-pause-btns">
          <button type="button" class="btn-pause" id="pause-btn">一時停止</button>
          <button type="button" class="btn-pause end" id="end-rush-btn">終了する</button>
        </div>
      </div>
    </div>

    <div id="main-screen">
      <div id="start-controls">
        <button type="button" class="intro-tab-btn" id="intro-tab-btn">説明を見る</button>
        <div class="intro-text" id="intro-text" hidden>
          <p>このゲームは、e東京喰種の「RUSH中」だけを楽しむシミュレーターです。</p>
          <p>大当たりまでは、ワンクリックで到達！</p>
          <p>RUSHに入ったら、実機同様にRUSHが始まります。</p>
          <p>保留を貯めて、アツい変動をつかみ取れ！</p>
        </div>
        <div class="select-block">
          <span class="ctrl-label">通常時の回転レート（大当たりまでの投資額に影響）</span>
          <select id="rate-select"></select>
        </div>
        <div class="select-block">
          <span class="ctrl-label">演出モード（RUSH中の当選告知カスタム）</span>
          <select id="mode-select"></select>
        </div>
        <div class="select-block">
          <span class="ctrl-label">ST消化速度</span>
          <select id="speed-select"></select>
        </div>
        <div class="hold-legend" id="hold-legend">
          <div class="hold-legend-title">保留の色・信頼度（目安）</div>
          <div class="hold-legend-body" id="hold-legend-body"></div>
        </div>
        <button type="button" class="btn-start" id="start-btn">スタート</button>
      </div>

      <div id="overlay" hidden>
        <div id="overlay-box"></div>
      </div>
    </div>

    <div id="history-panel">
      <div id="history-title">履歴</div>
      <div id="history-list"></div>
    </div>

  </div>

  <script src="logic.js"></script>
  <script src="rush-view-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
